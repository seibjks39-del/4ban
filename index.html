<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>4班人能飞</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">4班人能飞</div>
  <div class="clock" aria-live="polite"><span class="clock-label">北京时间</span><time id="beijing-time">正在获取时间…</time></div>
</header>
<main class="wrap">
  <section class="intro">
    <div>
      <p class="eyebrow">CLASS GALLERY</p>
      <h1>我们的照片墙</h1>
      <p class="subtitle">记录每一个值得珍藏的瞬间。</p>
    </div>
    <button id="admin-toggle" class="primary" type="button">进入管理</button>
  </section>

  <section id="admin-panel" class="admin-panel" hidden>
    <div class="panel-head">
      <div><h2>照片管理</h2><p>选择区域后上传照片，也可以替换或清空照片。</p></div>
      <button id="admin-close" class="quiet" type="button">收起</button>
    </div>
    <div class="admin-controls">
      <label for="slot-select">照片区域</label>
      <select id="slot-select"></select>
      <label class="upload-button" for="photo-input">选择照片</label>
      <input id="photo-input" type="file" accept="image/*" hidden>
      <button id="clear-slot" class="danger" type="button">清空此区域</button>
    </div>
    <p class="hint">提示：当前版本把照片保存在此浏览器的本机存储中。换手机、换浏览器或清除网站数据后，照片不会自动同步。此演示版没有云端账号系统。</p>
    <p id="admin-status" class="status" role="status"></p>
  </section>

  <section class="gallery-section" aria-label="照片区域">
    <div class="gallery-heading"><h2>照片展示</h2><span id="photo-count">已添加 0 / 20 张</span></div>
    <div id="gallery" class="gallery"></div>
  </section>
</main>
<footer><span>4班人能飞</span><span>把平凡的日子，收藏成闪光的回忆。</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
